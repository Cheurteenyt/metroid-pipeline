name: Metroid Smoke Test

on:
  push:
    paths:
      - 'requests/pending/*.json'
      - '.github/workflows/metroid-smoke.yml'
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact 40-char commit SHA to test (immutable)'
        required: true
        type: string
      profile:
        description: 'Test profile'
        required: true
        type: choice
        default: smoke
        options:
          - smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect trigger mode and extract request
        id: detect
        run: |
          mkdir -p proof
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger — build a synthetic request
            SHA="${{ inputs.source_commit }}"
            PROFILE="${{ inputs.profile }}"
            REQUEST_ID="manual-$(date +%s)"
            echo "Trigger mode: workflow_dispatch"
            echo "request_id=$REQUEST_ID" >> $GITHUB_OUTPUT
            echo "source_commit=$SHA" >> $GITHUB_OUTPUT
            echo "profile=$PROFILE" >> $GITHUB_OUTPUT
            echo "source_repo=gitlab.com/cheurteen/metroid" >> $GITHUB_OUTPUT
            echo "REQUEST_ID=$REQUEST_ID" >> $GITHUB_ENV
            echo "REQUESTED_SOURCE_COMMIT=$SHA" >> $GITHUB_ENV
            echo "PROFILE=$PROFILE" >> $GITHUB_ENV
          else
            # Push trigger — find request files added/modified in THIS commit
            echo "Trigger mode: push"
            
            # Get files changed in the push commit
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'requests/pending/*.json' 2>/dev/null || true)
            echo "Changed request files: $CHANGED"
            
            REQUEST_COUNT=$(echo "$CHANGED" | grep -c '\.json$' || true)
            echo "Request count: $REQUEST_COUNT"
            
            if [ -z "$CHANGED" ] || [ "$REQUEST_COUNT" -eq 0 ]; then
              echo "NO_VALID_REQUEST: no request files in this push"
              echo "REQUEST_ID=NONE" >> $GITHUB_ENV
              # Not a failure — could be a workflow file change
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            if [ "$REQUEST_COUNT" -gt 1 ]; then
              echo "::error::Multiple requests ($REQUEST_COUNT) in one push — not supported in POC"
              echo "Multiple requests found: $CHANGED"
              # Create a FAIL proof for this case
              REQUEST_ID="multi-request-fail"
              mkdir -p "proof/$REQUEST_ID"
              cat > "proof/$REQUEST_ID/run.json" << JSON
              {
                "request_id": "$REQUEST_ID",
                "status": "FAIL",
                "reason": "multiple_requests_in_single_push",
                "request_count": $REQUEST_COUNT,
                "changed_files": "$(echo $CHANGED | tr '\n' ' ')"
              }
              JSON
              echo "REQUEST_ID=$REQUEST_ID" >> $GITHUB_ENV
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 1
            fi
            
            # Exactly one request — parse it
            REQUEST_FILE=$(echo "$CHANGED" | head -1)
            echo "Processing request file: $REQUEST_FILE"
            
            if [ ! -f "$REQUEST_FILE" ]; then
              echo "::error::Request file not found: $REQUEST_FILE"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Parse JSON request
            REQUEST_ID=$(python3 -c "import json; d=json.load(open('$REQUEST_FILE')); print(d.get('request_id',''))")
            SOURCE_REPO=$(python3 -c "import json; d=json.load(open('$REQUEST_FILE')); print(d.get('source_repo',''))")
            SOURCE_COMMIT=$(python3 -c "import json; d=json.load(open('$REQUEST_FILE')); print(d.get('source_commit',''))")
            PROFILE=$(python3 -c "import json; d=json.load(open('$REQUEST_FILE')); print(d.get('profile',''))")
            
            echo "Request ID: $REQUEST_ID"
            echo "Source repo: $SOURCE_REPO"
            echo "Source commit: $SOURCE_COMMIT"
            echo "Profile: $PROFILE"
            
            # Validate request fields
            if [ -z "$REQUEST_ID" ]; then
              echo "::error::request_id is empty"
              exit 1
            fi
            if [ "$SOURCE_REPO" != "gitlab.com/cheurteen/metroid" ]; then
              echo "::error::source_repo must be 'gitlab.com/cheurteen/metroid', got '$SOURCE_REPO'"
              exit 1
            fi
            if [ "$PROFILE" != "smoke" ]; then
              echo "::error::profile must be 'smoke', got '$PROFILE'"
              exit 1
            fi
            
            echo "REQUEST_ID=$REQUEST_ID" >> $GITHUB_ENV
            echo "REQUESTED_SOURCE_COMMIT=$SOURCE_COMMIT" >> $GITHUB_ENV
            echo "PROFILE=$PROFILE" >> $GITHUB_ENV
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate source_commit format
        if: steps.detect.outputs.skip != 'true'
        run: |
          SHA="${{ env.REQUESTED_SOURCE_COMMIT }}"
          if [ "$SHA" = "main" ] || [ "$SHA" = "master" ] || [ "$SHA" = "HEAD" ]; then
            echo "::error::source_commit must be exact SHA, not branch name"
            exit 1
          fi
          if [ ${#SHA} -ne 40 ]; then
            echo "::error::source_commit must be 40 chars, got ${#SHA}"
            exit 1
          fi
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::source_commit must be hex, got $SHA"
            exit 1
          fi
          echo "Validated: source_commit is a 40-char hex SHA"

      - name: Checkout metroid source at exact SHA
        if: steps.detect.outputs.skip != 'true'
        id: checkout
        run: |
          git clone --depth=1 https://gitlab.com/cheurteen/metroid.git /tmp/metroid
          cd /tmp/metroid
          git fetch --depth=1 origin ${{ env.REQUESTED_SOURCE_COMMIT }}
          git checkout ${{ env.REQUESTED_SOURCE_COMMIT }}
          ACTUAL=$(git rev-parse HEAD)
          echo "CHECKED_OUT_SOURCE_COMMIT=$ACTUAL" >> $GITHUB_ENV
          if [ "$ACTUAL" = "${{ env.REQUESTED_SOURCE_COMMIT }}" ]; then
            echo "source_sha_match=true" >> $GITHUB_OUTPUT
            echo "Verified: checkout SHA matches requested SHA"
          else
            echo "source_sha_match=false" >> $GITHUB_OUTPUT
            echo "::error::SHA mismatch! Expected ${{ env.REQUESTED_SOURCE_COMMIT }}, got $ACTUAL"
            exit 1
          fi

      - name: Set up Python
        if: steps.detect.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.detect.outputs.skip != 'true'
        run: pip install capstone

      - name: Run smoke tests with strict accounting
        if: steps.detect.outputs.skip != 'true'
        id: tests
        run: |
          cd /tmp/metroid
          PROOF_DIR="$GITHUB_WORKSPACE/proof/${{ env.REQUESTED_ID }}"
          mkdir -p "$PROOF_DIR"
          
          EXPECTED_TESTS=(
            "switch/scripts/test_experiment_record.py"
            "switch/scripts/test_candidate_schema.py"
            "switch/scripts/test_batch_planner.py"
            "switch/scripts/test_candidate_ranker.py"
            "switch/scripts/test_batch_ledger.py"
            "switch/scripts/test_discovery_replay.py"
            "switch/scripts/test_structural_features.py"
          )
          
          TESTS_EXPECTED=${#EXPECTED_TESTS[@]}
          TESTS_FOUND=0
          TESTS_EXECUTED=0
          TESTS_PASSED=0
          TESTS_FAILED=0
          TESTS_MISSING=0
          
          RESULTS="["
          FIRST=1
          
          for test_file in "${EXPECTED_TESTS[@]}"; do
            STATUS="UNKNOWN"
            if [ ! -f "$test_file" ]; then
              STATUS="MISSING"
              TESTS_MISSING=$((TESTS_MISSING + 1))
            else
              TESTS_FOUND=$((TESTS_FOUND + 1))
              TESTS_EXECUTED=$((TESTS_EXECUTED + 1))
              echo "--- Running $test_file ---"
              if python "$test_file" >> "$PROOF_DIR/stdout.txt" 2>> "$PROOF_DIR/stderr.txt"; then
                STATUS="PASS"
                TESTS_PASSED=$((TESTS_PASSED + 1))
              else
                STATUS="FAIL"
                TESTS_FAILED=$((TESTS_FAILED + 1))
              fi
            fi
            
            if [ $FIRST -eq 1 ]; then FIRST=0; else RESULTS+=","; fi
            RESULTS+="{\"test\":\"$test_file\",\"status\":\"$STATUS\"}"
          done
          RESULTS+="]"
          
          echo "$RESULTS" > "$PROOF_DIR/test-results.json"
          
          echo "TESTS_EXPECTED=$TESTS_EXPECTED" >> $GITHUB_ENV
          echo "TESTS_FOUND=$TESTS_FOUND" >> $GITHUB_ENV
          echo "TESTS_EXECUTED=$TESTS_EXECUTED" >> $GITHUB_ENV
          echo "TESTS_PASSED=$TESTS_PASSED" >> $GITHUB_ENV
          echo "TESTS_FAILED=$TESTS_FAILED" >> $GITHUB_ENV
          echo "TESTS_MISSING=$TESTS_MISSING" >> $GITHUB_ENV
          
          echo "========================================"
          echo "TESTS EXPECTED   : $TESTS_EXPECTED"
          echo "TESTS FOUND      : $TESTS_FOUND"
          echo "TESTS EXECUTED   : $TESTS_EXECUTED"
          echo "TESTS PASSED     : $TESTS_PASSED"
          echo "TESTS FAILED     : $TESTS_FAILED"
          echo "TESTS MISSING    : $TESTS_MISSING"
          echo "========================================"
          
          if [ $TESTS_MISSING -ne 0 ]; then
            echo "::error::$TESTS_MISSING tests MISSING"
            exit 1
          fi
          if [ $TESTS_FAILED -ne 0 ]; then
            echo "::error::$TESTS_FAILED tests FAILED"
            exit 1
          fi
          if [ $TESTS_EXECUTED -ne $TESTS_EXPECTED ]; then
            echo "::error::executed ($TESTS_EXECUTED) != expected ($TESTS_EXPECTED)"
            exit 1
          fi
          if [ $TESTS_EXPECTED -eq 0 ]; then
            echo "::error::no tests expected"
            exit 1
          fi

      - name: Generate run.json
        if: always() && steps.detect.outputs.skip != 'true'
        run: |
          PROOF_DIR="proof/${{ env.REQUEST_ID }}"
          mkdir -p "$PROOF_DIR"
          
          RUNNER_SHA=$(git rev-parse HEAD)
          REQUESTED="${{ env.REQUESTED_SOURCE_COMMIT }}"
          CHECKED="${{ env.CHECKED_OUT_SOURCE_COMMIT }}"
          SHA_MATCH="${{ steps.checkout.outputs.source_sha_match }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          OS=$(uname -srm)
          PY_VER=$(python --version 2>&1)
          
          STATUS="FAIL"
          if [ "${{ env.TESTS_MISSING }}" = "0" ] \
             && [ "${{ env.TESTS_FAILED }}" = "0" ] \
             && [ "${{ env.TESTS_EXECUTED }}" = "${{ env.TESTS_EXPECTED }}" ] \
             && [ "$SHA_MATCH" = "true" ] \
             && [ "${{ env.TESTS_EXPECTED }}" != "0" ]; then
            STATUS="PASS"
          fi
          
          cat > "$PROOF_DIR/run.json" << JSON
          {
            "request_id": "${{ env.REQUEST_ID }}",
            "runner_repo": "Cheurteenyt/metroid-pipeline",
            "runner_commit": "$RUNNER_SHA",
            "trigger_commit": "${{ github.sha }}",
            "source_repo": "gitlab.com/cheurteen/metroid",
            "requested_source_commit": "$REQUESTED",
            "checked_out_source_commit": "$CHECKED",
            "source_sha_match": $SHA_MATCH,
            "profile": "${{ env.PROFILE }}",
            "runner_os": "$OS",
            "python_version": "$PY_VER",
            "timestamp_utc": "$TIMESTAMP",
            "status": "$STATUS",
            "tests_expected": ${{ env.TESTS_EXPECTED }},
            "tests_found": ${{ env.TESTS_FOUND }},
            "tests_executed": ${{ env.TESTS_EXECUTED }},
            "tests_passed": ${{ env.TESTS_PASSED }},
            "tests_failed": ${{ env.TESTS_FAILED }},
            "tests_missing": ${{ env.TESTS_MISSING }},
            "commands": [
              "git clone https://gitlab.com/cheurteen/metroid.git",
              "git checkout $REQUESTED",
              "python switch/scripts/test_*.py"
            ]
          }
          JSON
          
          cat "$PROOF_DIR/run.json"
          
          echo ""
          echo "=========================================="
          echo "REQUEST ID              : ${{ env.REQUEST_ID }}"
          echo "SOURCE COMMIT REQUESTED : $REQUESTED"
          echo "SOURCE COMMIT CHECKED   : $CHECKED"
          echo "SOURCE SHA MATCH        : $SHA_MATCH"
          echo ""
          echo "TESTS EXPECTED          : ${{ env.TESTS_EXPECTED }}"
          echo "TESTS FOUND             : ${{ env.TESTS_FOUND }}"
          echo "TESTS EXECUTED          : ${{ env.TESTS_EXECUTED }}"
          echo "TESTS PASSED            : ${{ env.TESTS_PASSED }}"
          echo "TESTS FAILED            : ${{ env.TESTS_FAILED }}"
          echo "TESTS MISSING           : ${{ env.TESTS_MISSING }}"
          echo ""
          echo "FINAL STATUS            : $STATUS"
          echo "=========================================="

      - name: Upload proof artifact
        if: always() && steps.detect.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ env.REQUEST_ID }}
          path: proof/
          retention-days: 30

      - name: Final status check
        if: always() && steps.detect.outputs.skip != 'true'
        run: |
          PROOF_DIR="proof/${{ env.REQUEST_ID }}"
          if [ -f "$PROOF_DIR/run.json" ]; then
            STATUS=$(python3 -c "import json; print(json.load(open('$PROOF_DIR/run.json'))['status'])")
            if [ "$STATUS" != "PASS" ]; then
              echo "::error::Run status is $STATUS"
              exit 1
            fi
          else
            echo "::error::No proof/run.json produced"
            exit 1
          fi
