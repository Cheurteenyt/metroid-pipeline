name: Metroid Smoke Test

on:
  push:
    paths:
      - 'requests/pending/*.json'
      - '.github/workflows/metroid-smoke.yml'
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact 40-char commit SHA to test'
        required: true
        type: string
      profile:
        description: 'Test profile'
        required: true
        type: choice
        default: smoke
        options:
          - smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      REQUEST_ID: ""
      REQUESTED_SOURCE_COMMIT: ""
      CHECKED_OUT_SOURCE_COMMIT: ""
      SOURCE_SHA_MATCH: "false"
      PROFILE: ""
      TESTS_EXPECTED: "0"
      TESTS_FOUND: "0"
      TESTS_EXECUTED: "0"
      TESTS_PASSED: "0"
      TESTS_FAILED: "0"
      TESTS_MISSING: "0"
      FAIL_REASON: ""
      CAPSTONE_VERSION: ""
      PYTEST_VERSION: ""
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure SSH for GitLab
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.GITLAB_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_ed25519 2>&1 || echo "ssh-add failed"
          ssh-keyscan -t ed25519 gitlab.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Detect trigger and parse request
        id: detect
        run: |
          mkdir -p proof
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REQUEST_ID=manual-$(date +%s)" >> $GITHUB_ENV
            echo "REQUESTED_SOURCE_COMMIT=${{ inputs.source_commit }}" >> $GITHUB_ENV
            echo "PROFILE=${{ inputs.profile }}" >> $GITHUB_ENV
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              COMMITS="${{ github.sha }}"
            else
              COMMITS=$(git rev-list --reverse ${{ github.event.before }}..${{ github.sha }} 2>/dev/null || echo "${{ github.sha }}")
            fi
            
            CHANGED=""
            for commit in $COMMITS; do
              files=$(git diff --name-only ${commit}^ ${commit} -- 'requests/pending/*.json' 2>/dev/null || true)
              if [ -n "$files" ]; then
                CHANGED="${CHANGED}${files}
"
              fi
            done
            
            CHANGED=$(echo -e "$CHANGED" | sort -u | grep -v '^$' || true)
            REQUEST_COUNT=$(echo "$CHANGED" | grep -c '\.json$' || echo "0")
            
            if [ -z "$CHANGED" ] || [ "$REQUEST_COUNT" -eq 0 ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            if [ "$REQUEST_COUNT" -gt 1 ]; then
              echo "REQUEST_ID=multi-fail" >> $GITHUB_ENV
              echo "FAIL_REASON=multiple_requests" >> $GITHUB_ENV
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 1
            fi
            
            REQUEST_FILE=$(echo "$CHANGED" | head -1)
            if [ ! -f "$REQUEST_FILE" ]; then
              echo "FAIL_REASON=file_not_found" >> $GITHUB_ENV
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 1
            fi
            
            python3 scripts/parse_request.py "$REQUEST_FILE" > /tmp/request_env.sh
            source /tmp/request_env.sh
            echo "REQUEST_ID=$REQUEST_ID" >> $GITHUB_ENV
            echo "REQUESTED_SOURCE_COMMIT=$REQUESTED_SOURCE_COMMIT" >> $GITHUB_ENV
            echo "PROFILE=$PROFILE" >> $GITHUB_ENV
            
            if [ -z "$REQUEST_ID" ]; then
              echo "FAIL_REASON=empty_request_id" >> $GITHUB_ENV
              exit 1
            fi
            if [ "$SOURCE_REPO" != "gitlab.com/cheurteen/metroid" ]; then
              echo "FAIL_REASON=invalid_source_repo" >> $GITHUB_ENV
              exit 1
            fi
            if [ "$PROFILE" != "smoke" ]; then
              echo "FAIL_REASON=invalid_profile" >> $GITHUB_ENV
              exit 1
            fi
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate source_commit format
        if: steps.detect.outputs.skip != 'true'
        run: |
          SHA="${{ env.REQUESTED_SOURCE_COMMIT }}"
          if [ -z "$SHA" ]; then
            echo "FAIL_REASON=empty_source_commit" >> $GITHUB_ENV
            exit 1
          fi
          if [ "$SHA" = "main" ] || [ "$SHA" = "master" ] || [ "$SHA" = "HEAD" ]; then
            echo "FAIL_REASON=branch_name" >> $GITHUB_ENV
            exit 1
          fi
          if [ ${#SHA} -ne 40 ] || ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL_REASON=invalid_sha" >> $GITHUB_ENV
            exit 1
          fi

      - name: Checkout metroid at exact SHA via SSH
        if: steps.detect.outputs.skip != 'true'
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" git clone git@gitlab.com:cheurteen/metroid.git /tmp/metroid
          cd /tmp/metroid
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" git fetch origin ${{ env.REQUESTED_SOURCE_COMMIT }}
          git checkout ${{ env.REQUESTED_SOURCE_COMMIT }}
          ACTUAL=$(git rev-parse HEAD)
          echo "CHECKED_OUT_SOURCE_COMMIT=$ACTUAL" >> $GITHUB_ENV
          if [ "$ACTUAL" = "${{ env.REQUESTED_SOURCE_COMMIT }}" ]; then
            echo "SOURCE_SHA_MATCH=true" >> $GITHUB_ENV
          else
            echo "SOURCE_SHA_MATCH=false" >> $GITHUB_ENV
            echo "FAIL_REASON=sha_mismatch" >> $GITHUB_ENV
            exit 1
          fi

      - name: Set up Python
        if: steps.detect.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        if: steps.detect.outputs.skip != 'true'
        run: |
          pip install capstone==5.0.1 pytest==8.3.2
          echo "CAPSTONE_VERSION=$(pip show capstone | grep Version | awk '{print $2}')" >> $GITHUB_ENV
          echo "PYTEST_VERSION=$(pip show pytest | grep Version | awk '{print $2}')" >> $GITHUB_ENV
          echo "PYTHON_VERSION=$(python --version | awk '{print $2}')" >> $GITHUB_ENV

      - name: Run smoke tests
        if: steps.detect.outputs.skip != 'true'
        run: |
          cd /tmp/metroid
          export PYTHONPATH="/tmp/metroid/switch/scripts:$PYTHONPATH"
          
          PROOF_DIR="$GITHUB_WORKSPACE/proof/${{ env.REQUEST_ID }}"
          mkdir -p "$PROOF_DIR"
          
          EXPECTED=(
            "switch/scripts/test_experiment_record.py"
            "switch/scripts/test_candidate_schema.py"
            "switch/scripts/test_batch_planner.py"
            "switch/scripts/test_candidate_ranker.py"
            "switch/scripts/test_batch_ledger.py"
            "switch/scripts/test_discovery_replay.py"
            "switch/scripts/test_structural_features.py"
          )
          
          TE=${#EXPECTED[@]}; TF=0; TX=0; TP=0; TFL=0; TM=0
          echo "[" > "$PROOF_DIR/test-results.json"
          FIRST=1
          
          for t in "${EXPECTED[@]}"; do
            S="UNKNOWN"
            if [ ! -f "$t" ]; then
              S="MISSING"; TM=$((TM+1))
            else
              TF=$((TF+1)); TX=$((TX+1))
              if PYTHONPATH="/tmp/metroid/switch/scripts:$PYTHONPATH" pytest "$t" -q >> "$PROOF_DIR/stdout.txt" 2>> "$PROOF_DIR/stderr.txt"; then
                S="PASS"; TP=$((TP+1))
              else
                S="FAIL"; TFL=$((TFL+1))
              fi
            fi
            if [ $FIRST -eq 1 ]; then FIRST=0; else echo "," >> "$PROOF_DIR/test-results.json"; fi
            printf '{"test":"%s","status":"%s"}' "$t" "$S" >> "$PROOF_DIR/test-results.json"
          done
          
          echo "]" >> "$PROOF_DIR/test-results.json"
          echo "TESTS_EXPECTED=$TE" >> $GITHUB_ENV
          echo "TESTS_FOUND=$TF" >> $GITHUB_ENV
          echo "TESTS_EXECUTED=$TX" >> $GITHUB_ENV
          echo "TESTS_PASSED=$TP" >> $GITHUB_ENV
          echo "TESTS_FAILED=$TFL" >> $GITHUB_ENV
          echo "TESTS_MISSING=$TM" >> $GITHUB_ENV
          
          if [ $TM -ne 0 ]; then echo "FAIL_REASON=tests_missing" >> $GITHUB_ENV; exit 1; fi
          if [ $TFL -ne 0 ]; then echo "FAIL_REASON=tests_failed" >> $GITHUB_ENV; exit 1; fi
          if [ $TX -ne $TE ]; then echo "FAIL_REASON=executed_ne_expected" >> $GITHUB_ENV; exit 1; fi

      - name: Generate run.json
        if: always() && steps.detect.outputs.skip != 'true'
        run: python3 scripts/generate_run_json.py

      - name: Upload proof artifact
        if: always() && steps.detect.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ env.REQUEST_ID || format('failed-{0}', github.run_id) }}
          path: proof/
          retention-days: 30

      - name: Update request lifecycle
        if: always() && steps.detect.outputs.skip != 'true'
        run: |
          REQUEST_FILE="requests/pending/${{ env.REQUEST_ID }}.json"
          if [ -f "$REQUEST_FILE" ]; then
            if [ "${{ job.status }}" = "success" ]; then
              mkdir -p requests/completed
              mv "$REQUEST_FILE" "requests/completed/"
            else
              mkdir -p requests/failed
              mv "$REQUEST_FILE" "requests/failed/"
            fi
          fi

      - name: Final status check
        if: always() && steps.detect.outputs.skip != 'true'
        run: python3 scripts/check_status.py
